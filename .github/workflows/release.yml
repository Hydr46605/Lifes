name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify tag matches build version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(./gradlew -q printVersion)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match build version $version."
            exit 1
          fi

      - name: Build
        run: ./gradlew --no-daemon --stacktrace clean build

      - name: Create checksums
        run: |
          cd build/libs
          sha256sum Lifes-*.jar > Lifes-sha256.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(build/libs/Lifes-*.jar build/libs/Lifes-sha256.txt)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refreshing its assets."
            gh release edit "$GITHUB_REF_NAME" --latest
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Lifes ${GITHUB_REF_NAME#v}" \
              --generate-notes \
              "${assets[@]}"
          fi
