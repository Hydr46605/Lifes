# Lifes configuration. Every wrong value fails startup with the exact path.
version: 1

lives:
  # Lives a brand new account starts with (1..100000).
  default: 3
  # Hard cap for any life count, including admin commands (>= default).
  maximum: 10

death:
  # Lives consumed by every counted death (0..1000).
  cost-per-death: 1
  # Deaths with these damage causes consume no lives.
  # Valid names: https://jd.papermc.io/paper/1.21/org/bukkit/event/entity/EntityDamageEvent.DamageCause.html
  ignored-causes: []
  # Runs in order after every counted death.
  # Types: MESSAGE, SOUND, COMMAND, PERMABAN, DISCORD, ULTIMATEUI_OPEN, ULTIMATEUI_CLOSE, ULTIMATEUI_SET
  # ULTIMATEUI_OPEN takes gui (required), hud (false) and autoclose (false):
  #   - type: ULTIMATEUI_OPEN
  #     gui: "lives-hud"
  #     hud: true
  # ULTIMATEUI_CLOSE takes an optional gui (closes the open GUI when absent).
  # ULTIMATEUI_SET rewrites one text element of the open GUI (element + text, same
  # placeholders as MESSAGE).
  # A DISCORD entry posts a raw Discord JSON payload to a webhook. The payload supports
  # {player} {uuid} {lives} {maximum} {deaths} {reason} {delta}, substituted as JSON-escaped
  # strings, and reaches Discord exactly as written (Components V2 included):
  #   - type: DISCORD
  #     webhook: "https://discord.com/api/webhooks/<numeric id>/<token>"
  #     payload: |
  #       {
  #         "username": "Lifes",
  #         "content": "**{player}** died. {lives} lives left."
  #       }
  # A payload with components but no "content" needs ?with_components=true on the webhook
  # URL, otherwise Discord rejects it with 400 "Cannot send an empty message".
  actions:
    - type: MESSAGE
      target: VICTIM          # VICTIM or BROADCAST
      message: "<red>You lost a life! <bold><gold>{lives}</gold></bold> remain."
    - type: SOUND
      sound: entity.wither.spawn
      volume: 1.0             # 0..64
      pitch: 0.6              # 0..4

exhaustion:
  # Runs in order, once, when lives reach zero. This is the exit path.
  actions:
    - type: MESSAGE
      target: BROADCAST
      message: "<bold><dark_red>{player} ran out of lives and is gone forever.</dark_red></bold>"
    - type: PERMABAN
      reason: "You have run out of lives."
  # What happens when an account that is already at zero lives connects, for example after
  # an admin lifted the ban. REAPPLY runs the actions above again (the default exit, so a
  # pardon alone does not resurrect anyone), KICK only removes them from the session,
  # IGNORE lets them play on. Values other than these three fail startup.
  on-zero-lives-join: REAPPLY

gain:
  # Runs in order after any life gain that does not leave zero (admin add, reward).
  # Types: MESSAGE, SOUND, COMMAND, PERMABAN, DISCORD
  # Placeholders: {player} {lives} {delta} {before} {reason} plus {uuid} {maximum}.
  actions: []

resurrect:
  # Runs in order when a gain leaves zero lives (before.lives == 0, delta > 0).
  # Types: MESSAGE, SOUND, COMMAND, PERMABAN, DISCORD
  # Placeholders: {player} {lives} {delta} {before} {reason} plus {uuid} {maximum}.
  actions: []

ultimateui:
  # Rewrites one text element after every life change, while the named GUI is open.
  # Both blank disables the refresh. gui + element must be set together.
  # refresh-text supports {player} {lives} {delta} {before} {reason} plus {uuid} {maximum} {deaths}.
  refresh-gui: ""
  refresh-element: ""
  refresh-text: "{lives}"

persistence:
  # Seconds between periodic saves; 0 disables. Every change also saves.
  save-interval-seconds: 300
  # Write saves.yml off the main thread (keep true).
  save-off-thread: true

messages:
  # MiniMessage. Placeholders are documented per key; unknown keys fail startup.
  prefix: "<dark_gray>[<gold>Lifes</gold>]</dark_gray> "
  lives-self: "You have <bold><gold>{lives}</gold></bold> lives."
  lives-other: "{player} has <bold><gold>{lives}</gold></bold> lives."
  lives-set: "Set <white>{player}</white> to <bold><gold>{lives}</gold></bold> lives."
  lives-add: "Gave <white>{amount}</white> lives to <white>{player}</white> (now <bold><gold>{lives}</gold></bold>)."
  lives-remove: "Removed <white>{amount}</white> lives from <white>{player}</white> (now <bold><gold>{lives}</gold></bold>)."
  lives-reset: "Reset <white>{player}</white> to <bold><gold>{lives}</gold></bold> lives."
  lives-unknown-player: "No known account for <white>{player}</white>."
  lives-invalid-amount: "Amount must be between {minimum} and {maximum}."
  lives-target-notify: "An administrator set your lives to <bold><gold>{lives}</gold></bold>."
  lives-exhausted-kick: "<red>You are out of lives. The game is over for this account.</red>"
  lives-reload-done: "Configuration reloaded."
  lives-list-dead-header: "Dead accounts (<gold>{count}</gold>, showing {shown}):"
  lives-list-dead-entry: "<gray>-</gray> {player}"
  lives-list-dead-more: "<gray>(+{remaining} more...)</gray>"
  lives-list-dead-empty: "Nobody is dead."
  lives-list-invalid-filter: "Unknown list '{filter}'; expected: dead."
  no-permission: "<red>You do not have permission to use this command.</red>"
